name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check setup script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-windows.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
      - run: npm ci
      - name: Assign release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $base = [version](Get-Content package.json | ConvertFrom-Json).version
          $releases = gh release list --limit 1000 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not read existing release versions.' }
          $published = @($releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { [version]($_.tagName.Substring(1)) } | Sort-Object -Descending)
          $version = $base.ToString()
          if ($published.Count -and $published[0] -ge $base) {
            $latest = $published[0]
            if ($latest.Major -ne $base.Major -or $latest.Minor -ne $base.Minor) { throw 'Update package.json to the current release series.' }
            $version = "$($base.Major).$($base.Minor).$($latest.Build + 1)"
          }
          npm version $version --no-git-tag-version --allow-same-version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm run build -- --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DSP-Fieldguide-Windows-x64
          path: |
            release/DSP-Fieldguide-Setup.exe
            release/DSP-Fieldguide-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Publish complete update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            $draft = gh release view $tag --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw 'This version is already published; start a new workflow run.' }
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "DSP Fieldguide $env:RELEASE_VERSION" --notes "Windows update. Install once to enable future automatic updates. Your workspace and configuration are preserved."
            if ($LASTEXITCODE) { throw 'Could not create draft release.' }
          }
          gh release upload $tag release/DSP-Fieldguide-Setup.exe release/DSP-Fieldguide-Setup.exe.blockmap release/latest.yml --clobber
          if ($LASTEXITCODE) { throw 'Could not upload update assets.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { throw 'Could not publish update.' }
