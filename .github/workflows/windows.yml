name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check setup script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-windows.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
      - run: npm ci
      - run: npm run build -- --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DSP-Fieldguide-Windows-x64
          path: release/DSP-Fieldguide-Setup.exe
          if-no-files-found: error
